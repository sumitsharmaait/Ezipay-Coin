# Values for the `sandbox` build type (see app/build.gradle.kts), pointing the app at
# the zero-cost local sandbox in ezipay-coin-platform:
#
#   pnpm sandbox:up && pnpm sandbox:serve
#
# Delete this file to remove the sandbox build type entirely; debug and release never
# read it.
#
# {host} is how the device reaches the development machine: 10.0.2.2 from the Android
# emulator. For a USB device, forward the ports and build against 127.0.0.1:
#
#   adb reverse tcp:15000 tcp:15000; adb reverse tcp:18545 tcp:18545; adb reverse tcp:14010 tcp:14010
#   ./gradlew installSandbox -PsandboxHost=127.0.0.1
host=10.0.2.2
api.baseUrl=http://{host}:15000/api/v1/
rpc.url=http://{host}:18545
iripash.baseUrl=http://{host}:14010/iripash/api/Payment/
chain.id=31337
# The same on every fresh sandbox chain (deployer nonces 0 and 8).
token.ezpt=0x5FbDB2315678afecb367f032d93F642f64180aa3
token.usdt=0x2279B7A0a67DB372996a5FaB50D91eAA73d2eBe6
